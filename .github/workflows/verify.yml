name: Verify OW Graphics
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ow-graphics
      - uses: actions/checkout@v4
        with:
          repository: OW-Programing-Language/ow-lang
          # Tested OW runtime; update deliberately after compatibility checks.
          ref: e249975a4f835e7ad5378cf7f3633e059d8396b4
          path: ow-lang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            ow-graphics/native-bridge/pom.xml
      - name: Install OW runtime artifact
        run: mvn -B -q -f ow-lang/pom.xml -DskipTests install
      - name: Resolve pinned flOW source and verify OW contracts
        working-directory: ow-graphics
        run: |
          java -jar ../ow-lang/target/OwIDE.jar deps install
          git diff --exit-code -- dependencies.lock.yml
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_flow.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_flow.ow
          java -jar ../ow-lang/target/OwIDE.jar check src/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_resources.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_resources.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/programmable_triangle/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/programmable_triangle/smoke.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_textures.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_textures.ow
      - name: Compile and test native SPI bridge (no GPU)
        run: mvn -B -q -f ow-graphics/native-bridge/pom.xml test
      - name: Install Mesa software OpenGL for framebuffer integration smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 libxcursor1 libxi6 libxrandr2 libxinerama1
      - name: Render real OpenGL triangle and verify framebuffer pixels
        run: |
          mvn -B -q -f ow-graphics/native-bridge/pom.xml package dependency:copy-dependencies -DoutputDirectory=target/lib
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            org.owgraphics.runtime.GpuSmoke
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            dev.oreo.Main run ow-graphics/examples/programmable_triangle/smoke.ow
