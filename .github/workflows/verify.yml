name: Verify OW Graphics
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ow-graphics
      - uses: actions/checkout@v4
        with:
          repository: OW-Programing-Language/ow-lang
          # Tested OW runtime; update deliberately after compatibility checks.
          ref: e249975a4f835e7ad5378cf7f3633e059d8396b4
          path: ow-lang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            ow-graphics/native-bridge/pom.xml
      - name: Install OW runtime artifact
        run: mvn -B -q -f ow-lang/pom.xml -DskipTests install
      - name: Resolve pinned flOW source and verify OW contracts
        working-directory: ow-graphics
        run: |
          java -jar ../ow-lang/target/OwIDE.jar deps install
          git diff --exit-code -- dependencies.lock.yml
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_flow.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_flow.ow
          java -jar ../ow-lang/target/OwIDE.jar check src/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_resources.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_resources.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/programmable_triangle/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/programmable_triangle/smoke.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_textures.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_textures.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/textured_quad/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/textured_quad/smoke.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_3d.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_3d.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/rotating_cube/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/rotating_cube/smoke.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_orbit.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_orbit.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/obj_loader.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/model_viewer/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/model_viewer/smoke.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_material_scene.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_material_scene.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_multiscene.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_multiscene.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/material_scene/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/material_scene/smoke.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_pbr_animation.ow
          java -jar ../ow-lang/target/OwIDE.jar run tests/headless_pbr_animation.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/gltf_loader.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/gltf_instancing/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/gltf_instancing/smoke.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/headless_gltf_scene.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/gltf_scene/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/gltf_scene/smoke.ow
          java -jar ../ow-lang/target/OwIDE.jar check tests/gltf_skinning.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/gltf_skinning/main.ow
          java -jar ../ow-lang/target/OwIDE.jar check examples/gltf_skinning/smoke.ow
      - name: Compile and test native SPI bridge (no GPU)
        run: mvn -B -q -f ow-graphics/native-bridge/pom.xml test
      - name: Install Mesa software OpenGL for framebuffer integration smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 libxcursor1 libxi6 libxrandr2 libxinerama1
      - name: Render real OpenGL triangle and verify framebuffer pixels
        run: |
          mvn -B -q -f ow-graphics/native-bridge/pom.xml package dependency:copy-dependencies -DoutputDirectory=target/lib
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            org.owgraphics.runtime.GpuSmoke
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            dev.oreo.Main run ow-graphics/examples/programmable_triangle/smoke.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            org.owgraphics.runtime.TexturedGpuSmoke
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            dev.oreo.Main run ow-graphics/examples/textured_quad/smoke.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            dev.oreo.Main run ow-graphics/examples/rotating_cube/smoke.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            org.owgraphics.runtime.DepthLightingGpuSmoke
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            org.owgraphics.runtime.NativeInputGpuSmoke
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "ow-lang/target/OwIDE.jar:ow-graphics/native-bridge/target/test-classes:ow-graphics/native-bridge/target/classes:ow-graphics/native-bridge/target/lib/*" \
            org.owgraphics.runtime.MultiLightGpuSmoke
      - name: Load OBJ model through actual OW runtime + flOW provider
        working-directory: ow-graphics
        run: |
          java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run tests/obj_loader.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run examples/model_viewer/smoke.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            org.owgraphics.runtime.MaterialSceneGpuSmoke
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run examples/material_scene/smoke.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            org.owgraphics.runtime.InstancingGpuSmoke
          java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run tests/gltf_loader.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run examples/gltf_instancing/smoke.ow
          java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run tests/headless_gltf_scene.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            org.owgraphics.runtime.GltfSceneGpuSmoke
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run examples/gltf_scene/smoke.ow
          java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run tests/gltf_skinning.ow
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            org.owgraphics.runtime.SkinningGpuSmoke
          xvfb-run -a -s "-screen 0 800x600x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "../ow-lang/target/OwIDE.jar:native-bridge/target/test-classes:native-bridge/target/classes:native-bridge/target/lib/*" \
            dev.oreo.Main run examples/gltf_skinning/smoke.ow
